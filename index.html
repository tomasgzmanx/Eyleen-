<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Y si volvemos?</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Courier New",Courier,monospace;font-weight:700;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;background-color:#6b4220;background-size:96px 96px;image-rendering:pixelated;-webkit-tap-highlight-color:transparent}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5)}
img{image-rendering:pixelated}
.card{position:relative;z-index:1;width:100%;max-width:380px;text-align:center;padding:26px 18px 22px;background:#c6c6c6;border:4px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555,0 8px 0 rgba(0,0,0,.4);color:#3b3b3b}
.scene{width:90px;height:90px;margin:18px auto 40px;perspective:500px}
.cube{width:90px;height:90px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
@keyframes spin{from{transform:rotateX(-25deg) rotateY(0)}to{transform:rotateX(-25deg) rotateY(360deg)}}
.f{position:absolute;width:90px;height:90px;background-size:100% 100%;image-rendering:pixelated}
.front{transform:translateZ(45px);filter:brightness(.85)}
.back{transform:rotateY(180deg) translateZ(45px);filter:brightness(.85)}
.right{transform:rotateY(90deg) translateZ(45px);filter:brightness(.7)}
.left{transform:rotateY(-90deg) translateZ(45px);filter:brightness(.7)}
.top{transform:rotateX(90deg) translateZ(45px)}
.bottom{transform:rotateX(-90deg) translateZ(45px);filter:brightness(.5)}
h1{font-size:21px;line-height:1.3;margin:0 0 20px}
.bar{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.slot{width:48px;height:48px;background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;display:flex;align-items:center;justify-content:center}
.slot.sel{outline:4px solid #fff;box-shadow:0 0 0 7px #000;position:relative;z-index:1}
.slot img{width:32px;height:32px}
.btns{display:flex;flex-direction:column;gap:14px;align-items:center}
button{font:inherit;font-weight:700;color:#fff;min-height:52px;width:100%;max-width:260px;cursor:pointer;border-radius:0;text-shadow:2px 2px 0 #3a3a3a;background:#7d7d7d;border:3px solid #000;box-shadow:inset 3px 3px 0 #bdbdbd,inset -3px -3px 0 #4a4a4a;transition:transform .15s}
#yes{font-size:20px;background:#4e9a2a;box-shadow:inset 3px 3px 0 #8fd66b,inset -3px -3px 0 #2d6a14}
#no{font-size:16px}
button:active{transform:translateY(3px)}
.item{position:fixed;bottom:-50px;width:36px;height:36px;animation:up 3s linear forwards;pointer-events:none;z-index:3}
@keyframes up{to{transform:translateY(-115vh)}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:5;width:min(92vw,340px);display:flex;gap:12px;align-items:center;padding:10px 14px;background:#1c1c1c;border:3px solid #555;color:#fff;text-align:left;transform:translate(-50%,-160%);transition:transform .6s}
.toast.show{transform:translate(-50%,0)}
.toast img{width:40px;height:40px;flex:none}
.toast b{display:block;color:#ffff55;font-size:15px}
.toast span{font-size:14px}
</style>
</head>
<body>
<div class="shade"></div>
<div class="toast" id="toast"><img id="toastimg" alt=""><div><b>¡Logro desbloqueado!</b><span>Volver juntos</span></div></div>
<div class="card">
  <div class="scene"><div class="cube">
    <div class="f front"></div><div class="f back"></div><div class="f right"></div>
    <div class="f left"></div><div class="f top"></div><div class="f bottom"></div>
  </div></div>
  <h1 id="msg">¿Y si volvemos a intentarlo?</h1>
  <div class="bar" id="bar"></div>
  <div class="btns" id="btns">
    <button id="yes">Sí</button>
    <button id="no">No</button>
  </div>
</div>
<script>
function R(s){return function(){s=(s*16807)%2147483647;return s/2147483647}}
function mk(w,h,d){var c=document.createElement("canvas");c.width=w;c.height=h;d(c.getContext("2d"));return c.toDataURL()}
function noise(x,cols,seed,y0,y1){var r=R(seed);for(var j=y0;j<y1;j++)for(var i=0;i<16;i++){x.fillStyle=cols[Math.floor(r()*cols.length)];x.fillRect(i,j,1,1)}}
var G=["#4f9a2b","#5fb336","#5fb336","#6cc641"],D=["#8b5a2b","#7a4e24","#9a6633","#6b4220","#8b5a2b"];
var grass=mk(16,16,function(x){noise(x,G,7,0,16)});
var dirt=mk(16,16,function(x){noise(x,D,3,0,16)});
var side=mk(16,16,function(x){noise(x,D,5,0,16);noise(x,G,9,0,4);var r=R(11);for(var i=0;i<16;i++){if(r()<.5){x.fillStyle=G[1];x.fillRect(i,4,1,1)}if(r()<.2){x.fillStyle=G[0];x.fillRect(i,5,1,1)}}});
function ico(g,p){return mk(g[0].length,g.length,function(x){for(var j=0;j<g.length;j++)for(var i=0;i<g[j].length;i++){var c=p[g[j][i]];if(c){x.fillStyle=c;x.fillRect(i,j,1,1)}}})}
var diamond=ico(["..0000..",".011120.","01122230","01222330",".022330.","..0330..","...00..."],{0:"#0a6a6a",1:"#c9fff7",2:"#2ee6d0",3:"#17b7a6"});
var heart=ico([".11.11.","1221221","1232221","1222221",".12221.","..121..","...1..."],{1:"#5a0a0a",2:"#e32b2b",3:"#ff9a9a"});
var torch=ico(["..1..",".121.",".121.","..3..","..3..","..3..","..3.."],{1:"#ffd23f",2:"#ff8c1a",3:"#8b5a2b"});
var icons=[diamond,heart,torch];
document.body.style.backgroundImage="url("+dirt+")";
var faces={front:side,back:side,right:side,left:side,top:grass,bottom:dirt};
for(var k in faces){document.querySelector(".f."+k).style.backgroundImage="url("+faces[k]+")"}
var bar=document.getElementById("bar");
for(var s=0;s<5;s++){var d=document.createElement("div");d.className="slot";var im=document.createElement("img");im.src=icons[s%3];im.alt="";d.appendChild(im);bar.appendChild(d)}
var slots=bar.children;slots[0].classList.add("sel");
var texts=[
 "¡No seas así! Te regalo un diamante",
 "Sin ti mi mundo está vacío…",
 "Mira que me quedo sin corazones",
 "Anda, te construyo una casa con vistas",
 "Dame una segunda oportunidad, Eyleen 💙"
];
var i=0,scale=1,yes=document.getElementById("yes"),no=document.getElementById("no");
no.addEventListener("click",function(){
  document.getElementById("msg").textContent=texts[i%texts.length];i++;
  for(var n=0;n<5;n++)slots[n].classList.remove("sel");
  slots[i%5].classList.add("sel");
  scale=Math.min(scale+0.12,1.35);
  yes.style.transform="scale("+scale+")";
  yes.style.marginBottom=(scale-1)*40+"px";
});
yes.addEventListener("click",function(){
  document.getElementById("msg").innerHTML="¡Estoy muy feliz de volver contigo!";
  document.getElementById("btns").style.display="none";
  document.getElementById("toastimg").src=diamond;
  document.getElementById("toast").classList.add("show");
  for(var k=0;k<30;k++){(function(k){setTimeout(function(){
    var e=document.createElement("img");e.className="item";e.alt="";
    e.src=icons[k%3];e.style.left=Math.random()*90+"%";
    document.body.appendChild(e);
    setTimeout(function(){e.remove()},3200);
  },k*120)})(k)}
});
</script>
</body>
</html>
